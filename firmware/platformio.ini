; Smart Infant Incubator — ESP32 firmware
;
; One environment. Board is the classic ESP32 DevKit V1; the PRD's dual-core
; FreeRTOS split is why esp32dev is enough and no S3 variant is needed.
;
; Per-device values come from -D flags in `build_flags`, never from code edits:
; see firmware/README.md for the provisioning recipe.
[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib

[env:esp32dev]
platform = espressif32@^6.9
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; data/ca.crt is uploaded once per board: pio run -t uploadfs
data_dir = data

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I include
  ; ---- identity: change these per device ----
  -DDEVICE_CODE="\"INC-001\""
  -DWIFI_SSID="\"iot-komdis\""
  -DWIFI_PASSWORD="\"iotkomdis123\""
  ; Secrets come from the shell, never from this file:
  ;   export MQTT_PASSWORD=... DEVICE_TOKEN=...
  -DMQTT_PASSWORD=\"${sysenv.MQTT_PASSWORD}\"
  -DDEVICE_TOKEN=\"${sysenv.DEVICE_TOKEN}\"
  ; ---- broker / server ----
  -DMQTT_HOST="\"41.216.180.77\""
  -DMQTT_PORT=8883
  -DHTTP_BASE_URL="\"https://iot-komdis-2.test\""
  ; 1 = verify against data/ca.crt, 0 = skip verification
  -DTLS_VERIFY=1

lib_deps =
  bblanchon/ArduinoJson@^6.21
  knolleary/PubSubClient@^2.8
  milesburton/DallasTemperature@^3.11
  paulstoffregen/OneWire@^2.3
  adafruit/DHT sensor library@^1.4
  adafruit/Adafruit Unified Sensor@^1.1
  marcoschwartz/LiquidCrystal_I2C@^1.1

; The control logic has no Arduino dependency, so it is proven on the host
; before a board is ever flashed.
;   firmware/host_test/run.sh
